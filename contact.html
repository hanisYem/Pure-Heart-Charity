<body>
    <header>
        <h1>Contact Us</h1>
        <p>We’d love to hear from you! Reach out with any questions or to get involved.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>

    <section>
        <h2>Get in Touch</h2>
        <p>Email: <a href="mailto:info@charity.org">info@charity.org</a></p>
        <p>Phone: <a href="tel:+1234567890">+1 234 567 890</a></p>

        <h2>Contact Form</h2>
        <form id="contactForm">
            <label for="contactName">Full Name:</label>
            <input type="text" id="contactName" placeholder="Enter your full name" required>

            <label for="contactEmail">Email Address:</label>
            <input type="email" id="contactEmail" placeholder="Enter your email" required>

            <label for="message">Message:</label>
            <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>

            <button type="submit">Send</button>
        </form>
    </section>
